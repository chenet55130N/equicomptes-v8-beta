name: Installer EquiComptes V8.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier puis installer V8.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64,lzma,subprocess,sys
          old = {
              'index.html': '8502183646b1699bc6fb26ae3e82084241005f2f4a713e745aca75c273af5ed5',
              'sync-v8.js': 'b6590243887eb9e62c935f307a9bb049dc861d6d3b3f02e90d85731c499d92cc',
              'service-worker.js': 'aeacbfb9c4b7ac7009d77fb8ed2ebb0d8ee03c20b3d7f7c2ca1703c1f195af87',
              'manifest.webmanifest': 'a313cec14b9bb33d80140733b88a79e56fec0d325011c5257912a092a5b1c029',
          }
          new = {
              'index.html': 'bbe9267ca0dd9812829082d75345513941b500fd4f456e3c1f9461281c1aa574',
              'sync-v8.js': '604af7d4509771471934dc0474f41be93bd4398ca1c94c84e261d4ffd2a993da',
              'service-worker.js': '6c43a56f70ab159a7ddac2624329b7847a43413b9a1c0f668b766a9eae75e35b',
              'manifest.webmanifest': '8dc80579e396fafa41ccca74f94ed582cccb93a5e0c54b2d2c164f029a9cf9b5',
          }
          for name, sha in old.items():
              p = Path(name)
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != sha:
                  sys.exit('STOP : source inattendue : ' + name)
          payload = (
              ''
              ''
              ''
              ''
              ''
              ''
          )
          patch_file = Path('/tmp/equi_v81.patch')
          patch_file.write_bytes(lzma.decompress(base64.b64decode(payload)))
          subprocess.run(['patch', '--batch', '--fuzz=0', '-p0', '-i', str(patch_file)], check=True)
          for name, sha in new.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != sha:
                  sys.exit('STOP : verification finale incorrecte : ' + name)
          print('Correctif V8.1 verifie')
          PY
      - name: Publier V8.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sync-v8.js service-worker.js manifest.webmanifest
          git commit -m 'Installer EquiComptes V8.1'
          git push
