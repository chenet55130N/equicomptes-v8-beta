name: Générer les icônes ÉquiComptes V9

on:
  push:
    branches:
      - correctif-v9-icone-9-20261116
    paths:
      - tools/icon-v9-retouche.py

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dépendances graphiques
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Modifier seulement la gravure 8 en 9
        run: python tools/icon-v9-retouche.py
      - name: Enregistrer les nouvelles icônes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "icon(V9): gravure du chiffre 9, dessin inchangé" && git push)
